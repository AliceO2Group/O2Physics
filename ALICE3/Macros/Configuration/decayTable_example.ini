# Example decay table for the on-the-fly decayer (configurable "decayTable")
# Overrides the TDatabasePDG decay channels of the listed mothers; unlisted particles are unaffected.
# Format: <motherPdg>.<channelName>: <branchingRatio> <daughterPdg1> <daughterPdg2> ...
# Branching ratios of each mother should sum to 1 (within 0.01); small deviations are renormalised.

# Lambda -> p pi- only
3122.ch0: 0.639 2212 -211
-3122.ch0: 0.639 -2112 111

# Lambda -> n pi0 only
3122.ch1: 0.361 2112 111
-3122.ch1: 0.361 -2112 111

# Xi- -> Lambda pi-
3312.ch0: 1.0 3122 -211
-3312.ch0: 1.0 -3122 211
